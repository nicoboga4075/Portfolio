stages:
  - setup
  - build
  - test
  - teardown
  
status-job:
  stage: setup
  tags: 
    - windows-local
  script:
     - ./runner_status.ps1
  
build-job:
  stage: build
  tags: 
    - windows-local
  script:
    - echo "Building..."
    - echo "Build done!"

test-job:
  stage: test
  tags: 
    - windows-local
  script:
    - echo "Running tests..."
    - echo "All tests passed."
    
cleanup-job:
  stage: teardown
  tags:
    - windows-local
  script:
    - Get-ChildItem -Path "C:\GitLab-Runner\builds" -Recurse | Remove-Item -Force -Recurse
    