default:
  tags:
    - windows-local

variables:
  GIT_CLEAN_FLAGS: -ffdx --exclude=node_modules/
  GIT_DEPTH: 1

stages:
  - setup
  - build
  - test
  - sonar
  - teardown

status-job:
  stage: setup
  script:
    - powershell -ExecutionPolicy Bypass -File ./runner_status.ps1
  artifacts:
    expire_in: 1 day

build-job:
  stage: build
  script:
    - echo "Installing dependencies..."
    - |
      if ($env:CI -eq "true") {
        echo "> npm ci"
        npm ci --cache .npm-cache
      } else {
        echo "> npm install"
        npm install
      }
    - echo "Building application..."
    - echo "> npm run build"
    - npm run build
    - echo "Build done!"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
    policy: pull-push

test-job:
  stage: test
  script:
    - New-Item -ItemType Directory -Force -Path reports/jest/html, reports/jest/coverage, reports/playwright/html, reports/playwright/test-results | Out-Null
    - Set-Content -Path reports/jest/junit.xml -Value '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>'
    - Set-Content -Path reports/playwright/junit.xml -Value '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>'
    - echo "Running Jest tests..."
    - npm run jest
    - echo "Running Playwright tests..."
    - npx playwright test *> $null -ErrorAction SilentlyContinue; if ($LASTEXITCODE -ne 0) { echo "No tests found, exiting with code 0" }
    - echo "Run done!"
  # % Lines of Jest's "All files" row; the other columns hold decimals too (1.47), not only whole numbers
  coverage: '/All files\s+\|\s+[\d.]+\s+\|\s+[\d.]+\s+\|\s+[\d.]+\s+\|\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      junit:
        - reports/jest/junit.xml
        - reports/playwright/junit.xml
    paths:
      - reports/jest/junit.xml
      - reports/playwright/junit.xml
      - reports/jest/html/
      - reports/jest/coverage/
      - reports/playwright/html/
      - reports/playwright/test-results/
    expire_in: 1 week
    
sonar-job:
  allow_failure: true
  stage: sonar
  variables:
    GIT_DEPTH: 0
  dependencies:
    - test-job
  script:
    - |
      # GitHub Actions analyses every pushed commit: run this analysis only when it doesn't, so GitLab never overwrites the main branch of SonarCloud (late analyses, VERSION events)
      try {
        $runs = @((Invoke-RestMethod "https://api.github.com/repos/nicoboga4075/Portfolio/actions/runs?head_sha=$env:CI_COMMIT_SHA").workflow_runs | Where-Object { $_.name -eq 'Node.js CI' })
      } catch {
        # GitHub API unreachable or rate limited: analyse here rather than skip blindly
        echo "Could not read the GitHub Actions runs ($($_.Exception.Message)): analysing on GitLab"
        $runs = @()
      }
      if ($runs.Count -gt 0) {
        # Skip the analysis here, but wait for the sonar job of GitHub (quality gate included) and take its verdict, polling once a minute for up to 20 minutes
        $run = $runs[0]
        echo "GitHub Actions analyses $env:CI_COMMIT_SHA (Node.js CI run $($run.id)): SonarCloud analysis skipped on GitLab, waiting for the GitHub sonar job..."
        $deadline = (Get-Date).AddMinutes(20)
        $job = $null
        while ((Get-Date) -lt $deadline) {
          try {
            $job = (Invoke-RestMethod "https://api.github.com/repos/nicoboga4075/Portfolio/actions/runs/$($run.id)/jobs").jobs | Where-Object { $_.name -eq 'sonar' } | Select-Object -First 1
          } catch {
            echo "Could not read the jobs of run $($run.id) ($($_.Exception.Message)), retrying"
          }
          if ($job -and $job.status -eq 'completed') { break }
          Start-Sleep -Seconds 60
        }
        if (-not $job -or $job.status -ne 'completed') {
          echo "The GitHub sonar job did not finish within 20 minutes: see https://github.com/nicoboga4075/Portfolio/actions/runs/$($run.id)"
          exit 1
        }
        echo "GitHub sonar job: $($job.conclusion) ($($job.html_url))"
        # failure (the quality gate included), cancelled or timed_out fail this job; success and skipped (Dependabot) pass
        if ($job.conclusion -in @('failure', 'cancelled', 'timed_out')) { exit 1 }
      } else {
        echo "No GitHub Actions run for ${env:CI_COMMIT_SHA}: running the SonarCloud analysis on GitLab..."
        npx @sonar/scan "-Dsonar.token=$env:SONAR_TOKEN"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        echo "Sonar analysis done!"
      }

cleanup-job:
  stage: teardown
  script:
    - Get-ChildItem -Path "C:\GitLab-Runner\builds" -Recurse | Remove-Item -Force -Recurse
  artifacts:
    expire_in: 1 day