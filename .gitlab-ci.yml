stages:
  - setup
  - build
  - test
  - teardown
  
status-job:
  stage: setup
  tags: 
    - windows-local
  script:
     - powershell -ExecutionPolicy Bypass -File ./runner_status.ps1
  
build-job:
  stage: build
  tags: 
    - windows-local
  script:
    - echo "Building..."
    - |
      if ($env:CI -eq "true") {
        echo "> npm ci"
        npm ci
      } else {
        echo "> npm install"
        npm install
      }
    - echo "Build done!"

test-job:
  stage: test
  tags: 
    - windows-local
  script:
    - echo "Running tests..."
    - npm run jest
    - echo "Run done!"
  coverage: '/All files\s+\|\s+\d+\s+\|\s+\d+\s+\|\s+\d+\s+\|\s+([\d\.]+)/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week
    
cleanup-job:
  stage: teardown
  tags:
    - windows-local
  script:
    - Get-ChildItem -Path "C:\GitLab-Runner\builds" -Recurse | Remove-Item -Force -Recurse
    