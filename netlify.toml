[build]
  publish = "."
  command = "npm run build"

[dev]
  port = 8888
  # dev-watch.js opens 8888 (browser-sync) once netlify dev is up: netlify dev must not open its own port (proxy on 8889)
  autoLaunch = false
  framework = "#static"
  publish = ".eleventy"
  staticServerPort = 3999

[[context.production.plugins]]
  package = "netlify-plugin-minify-html"

  [context.production.plugins.inputs.minifierOptions]
    removeComments = true
    collapseInlineTagWhitespace = true

[[context.production.plugins]]
  package = "netlify-plugin-inline-critical-css"

  [context.production.plugins.inputs]
    fileFilter = ["*.html"]
    directoryFilter = ["!node_modules"]
    extract = false
    # One headless browser pass per size and page: above 1920 the above-the-fold CSS barely changes, so larger screens only slow the build
    dimensions = [
      { width = 360, height = 740 },   # Small phone
      { width = 414, height = 896 },   # Large phone
      { width = 768, height = 1024 },  # Tablet
      { width = 1366, height = 768 },  # Laptop
      { width = 1920, height = 1080 }  # Desktop
    ]

[[context.production.plugins]]
  package = "@netlify/plugin-lighthouse"

  # No fail_deploy_on_score_thresholds: the plugin then runs in onSuccess and audits this deploy's own URL (DEPLOY_URL + path) once it is live, not the previous deploy.

  [context.production.plugins.inputs.settings]
    preset = "desktop"
    locale = "en"

  [context.production.plugins.inputs.thresholds]
    performance = 0.5
    accessibility = 0.5
    best-practices = 0.5
    seo = 0.5

  [[context.production.plugins.inputs.audits]]
    path = ""

  [[context.production.plugins.inputs.audits]]
    path = "en"

  [[context.production.plugins.inputs.audits]]
    path = "fr"

  [[context.production.plugins.inputs.audits]]
    path = "en/blog"

  [[context.production.plugins.inputs.audits]]
    path = "fr/blog"

  [[context.production.plugins.inputs.audits]]
