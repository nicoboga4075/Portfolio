[build]
  publish = "."  

[dev]
  port = 8888
  framework = "#static"
  publish = "."
  staticServerPort = 3999

[[redirects]]
  from = "/en"
  to = "/index_en.html"
  status = 200

[[redirects]]
  from = "/fr"
  to = "/index_fr.html"
  status = 200
  
