{%- set lang = page.fileSlug.slice(-2) -%}
<div id="soft-skills" class="owl-carousel owl-theme d-none">
    {%- for s in skills.soft %}
    <div class="d-flex flex-column align-items-center"><img src="images/{{ s.key }}.png" class="img-fluid" alt="{{ s[lang] | safe }}" loading="lazy" height="75" width="75"><span>{{ s[lang] | safe }}</span></div>
    {%- endfor %}
</div>
