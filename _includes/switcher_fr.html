<div class="d-flex align-items-center justify-content-center" id="language-switch">
    <span class="lang-text off">EN</span>
    <label class="toggle-container">
        <input id="language-toggle" type="checkbox" aria-label="Sélecteur de langue anglais/français">
        <span class="toggle-slider"></span>
    </label>
    <span class="lang-text on">FR</span>
</div>
