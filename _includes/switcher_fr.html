<div class="language-switch d-flex align-items-center justify-content-center">
    <span class="lang-text off">EN</span>
    <label class="toggle-container" aria-label="Sélecteur de langue anglais/français">
        <input id="language-toggle" type="checkbox">
        <span class="toggle-slider"></span>
    </label>
    <span class="lang-text on">FR</span>
</div>
