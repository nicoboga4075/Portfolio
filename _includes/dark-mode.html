{%- set parts = page.fileSlug.split("_") -%}
{%- set suffix = parts[parts.length - 1] -%}
{%- set lang = suffix if suffix.length == 2 else siteLanguages.default -%}
{#- Rendered in the "auto" state; toggleDarkMode() in common.js sets the stored one (icon, sr-only label, title) on load. -#}
<button id="dark-icon" type="button" class="{% if assets %}icon-adjust{% endif %}" data-icon-mode="{% if assets %}font{% else %}emoji{% endif %}" data-label-auto="{{ nav[lang].theme.auto }}" data-label-light="{{ nav[lang].theme.light }}" data-label-dark="{{ nav[lang].theme.dark }}" data-bs-toggle="tooltip" title="{{ nav[lang].theme.auto }}" onclick="toggleDarkMode(event)">{%- if not assets %}<span aria-hidden="true" data-emoji-auto="&#127763;" data-emoji-light="&#9728;&#65039;" data-emoji-dark="&#127769;">&#127763;</span>{% endif -%}<span class="sr-only">{{ nav[lang].theme.auto }}</span></button>
