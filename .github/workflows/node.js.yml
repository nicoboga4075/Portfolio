# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [lts/iron, lts/jod, lts/krypton] # 20.20.2 (2026-03-24, end of life, backward compatibility), 22.23.4 (2026-10-21), 24.22.1 (2026-10-21)
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run build

  # Jest, Playwright, Cypress and Robot Framework in four jobs that run side by side, each failing the run when one of its tests fails and uploading its reports even then
  jest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run jest
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-jest
        path: reports/jest/

  playwright:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    # Chromium, Firefox and WebKit with their system libraries, for the *.browser.spec.js specs and the contrast checker, installed through an npm script so the playwright binary of package-lock.json runs instead of one npx could fetch (SonarCloud githubactions:S6505, S8543); then the tests, only once the browsers are there
    - run: npm run playwright:install && npm run playwright
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-playwright
        path: reports/playwright/

  cypress:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    # The Cypress binary, which --ignore-scripts skips, through an npm script for the same reason as playwright:install; tests/cypress.config.js builds and serves the site itself
    - run: npm run cypress:install && npm run cypress
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-cypress
        path: reports/cypress/
        if-no-files-found: ignore

  robot:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: tests/robot/requirements.txt
    # The lock of tests/robot/requirements.txt, every package checked against its hash and installed from a wheel, so no setup script runs (SonarCloud githubactions:S8541, S8544); Chrome comes with the runner and Selenium Manager fetches its driver
    - run: 'pip install --only-binary :all: --require-hashes -r tests/robot/requirements.txt'
    - run: npm ci --ignore-scripts
    - run: npm run eleventy
      env:
        ELEVENTY_PREVIEW: '1'
    # The built site on a free port in the background, which writes the port it got to reports/robot/port for the tests
    - name: Robot Framework on the built site
      run: |
        node tests/serve-build.mjs --port-file reports/robot/port &
        for i in $(seq 50); do [ -s reports/robot/port ] && break; sleep 0.2; done
        robot --outputdir reports/robot --xunit junit.xml --variable "BASE_URL:http://localhost:$(cat reports/robot/port)" tests/robot
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-robot
        path: reports/robot/

  sonar:
    needs: [jest, playwright, cypress, robot]
    # Also after a failed test, so SonarCloud still gets the coverage and the test reports of the run
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: reports-jest
        path: reports/jest/
    - uses: actions/download-artifact@v8
      with:
        name: reports-playwright
        path: reports/playwright/
    # Same version as the GitLab analysis (@sonar/scan reads package.json): a different one resets SonarCloud's "previous version" new code period
    - name: Read the project version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
