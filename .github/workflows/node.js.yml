# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [lts/iron, lts/jod, lts/krypton] # 20.20.2 (2026-03-24, end of life, backward compatibility), 22.23.4 (2026-10-21), 24.22.1 (2026-10-21)
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run build

  # PSScriptAnalyzer on the PowerShell of .gitlab/, ShellCheck on the bash -c scripts of package.json and actionlint on these workflows (lint-scripts.js); the runner image has pwsh and ShellCheck, actionlint comes from its release, checked against its SHA-256
  lint-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - name: Install PSScriptAnalyzer and actionlint
      run: |
        pwsh -NoProfile -Command "if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-PSResource PSScriptAnalyzer -Version 1.24.0 -Scope CurrentUser -TrustRepository }"
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
        echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$archive" -C "$HOME/.local/bin" actionlint
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - run: npm run lint:ps
    - run: npm run lint:sh

  # The Bats tests of scripts/ (release, tag-version, push-all, rollback-reflog), each in a temporary git repository with a local bare origin; the Pester tests of the PowerShell run on the Windows runner of GitLab, where these scripts run
  bats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run test:sh
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-bats
        path: reports/bats/

  # Jest, Playwright, Cypress and Robot Framework in four jobs that run side by side, each failing the run when one of its tests fails and uploading its reports even then
  jest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run jest
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-jest
        path: reports/jest/

  # The version of Playwright in package-lock.json, which names the image of the playwright job: its browsers must be the ones that version drives
  playwright-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: package-lock.json
        sparse-checkout-cone-mode: false
    - id: version
      run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  playwright:
    needs: [build, playwright-image]
    runs-on: ubuntu-latest
    # The official image of that Playwright version, Ubuntu 24.04 with Chromium, Firefox, WebKit and their system libraries already there: no apt-get from a slow Ubuntu mirror (12 minutes and more on 2026-11-18, 19 and 20, which timed the job out) and no WebKit missing the ICU of a newer Ubuntu; user 1001, the runner's, as the Playwright docs advise, so the workspace and Firefox's home stay its own
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-image.outputs.version }}-noble
      options: --user 1001
    # About 6 minutes of tests
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    # The *.browser.spec.js specs and the contrast checker run on the browsers of the image
    - run: npm run playwright
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-playwright
        path: reports/playwright/

  cypress:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci --ignore-scripts
    # The Cypress binary, which --ignore-scripts skips, through an npm script for the same reason as playwright:install; tests/cypress.config.js builds and serves the site itself
    - run: npm run cypress:install && npm run cypress
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-cypress
        path: reports/cypress/screenshots/
        if-no-files-found: ignore

  robot:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js of .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: tests/robot/requirements.txt
    # The lock of tests/robot/requirements.txt, every package checked against its hash and installed from a wheel, so no setup script runs (SonarCloud githubactions:S8541, S8544); Chrome comes with the runner and Selenium Manager fetches its driver
    - run: 'pip install --only-binary :all: --require-hashes -r tests/robot/requirements.txt'
    - run: npm ci --ignore-scripts
    - run: npm run eleventy
      env:
        ELEVENTY_PREVIEW: '1'
    # The built site on a free port in the background, which writes the port it got to reports/robot/port for the tests
    - name: Robot Framework on the built site
      run: |
        node tests/serve-build.mjs --port-file reports/robot/port &
        for _ in $(seq 50); do [ -s reports/robot/port ] && break; sleep 0.2; done
        robot --outputdir reports/robot --xunit junit.xml --variable "BASE_URL:http://localhost:$(cat reports/robot/port)" tests/robot
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-robot
        path: reports/robot/

  sonar:
    needs: [jest, playwright, cypress, robot]
    # Also after a failed test, so SonarCloud still gets the coverage and the test reports of the run
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: reports-jest
        path: reports/jest/
    - uses: actions/download-artifact@v8
      with:
        name: reports-playwright
        path: reports/playwright/
    # Same version as the GitLab analysis (@sonar/scan reads package.json): a different one resets SonarCloud's "previous version" new code period
    - name: Read the project version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
