# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run build

  # Jest and Playwright in two jobs that run side by side, each failing the run when one of its tests fails and uploading its reports even then
  jest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run jest
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-jest
        path: reports/jest/

  playwright:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci --ignore-scripts
    # Chromium only, for the contrast checker that check-contrast.spec.js runs (it opens the built site in it), installed through an npm script so the playwright binary of package-lock.json runs instead of one npx could fetch (SonarCloud githubactions:S6505, S8543); then the tests, only once Chromium is there
    - run: npm run playwright:install -- chromium && npm run playwright
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: reports-playwright
        path: reports/playwright/

  sonar:
    needs: [jest, playwright]
    # Also after a failed test, so SonarCloud still gets the coverage and the test reports of the run
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: reports-jest
        path: reports/jest/
    - uses: actions/download-artifact@v8
      with:
        name: reports-playwright
        path: reports/playwright/
    # Same version as the GitLab analysis (@sonar/scan reads package.json): a different one resets SonarCloud's "previous version" new code period
    - name: Read the project version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
