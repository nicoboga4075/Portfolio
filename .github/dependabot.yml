version: 2
updates:
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day, weekends included ("daily" only runs on weekdays)
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
      timezone: "Europe/Paris"
    # The gitmoji of a dependency upgrade, as every commit of CLAUDE.md: the pull request titles are built from the commit message, so they get it too
    commit-message:
      prefix: "⬆️"
    groups:
      # The Capacitor packages (android, cli, core) release together and must stay on the same version
      capacitor:
        patterns:
          - "@capacitor/*"
      # Jest and its jsdom environment come from the same monorepo and release together: jest-environment-jsdom must stay on the version of jest
      jest:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
      # stylelint-config-standard follows the major versions of stylelint (a peer dependency): one pull request for both
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-config-*"
    ignore:
      # Stylelint 18 and stylelint-config-standard 41 need Node 22.22.2 or later, while the CI build still runs on Node 20 (lts/iron): held back, see SECURITY.md
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint-config-standard"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    # Keep the actions of .github/workflows up to date (checkout, setup-node, artifacts, scan actions), including the ones pinned to a commit SHA
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️"
  - package-ecosystem: "pip"
    # Robot Framework and SeleniumLibrary of tests/robot/requirements.in, and their lock with hashes requirements.txt (pip-compile), installed by the robot job of node.js.yml
    directory: "/tests/robot"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️"
    groups:
      # SeleniumLibrary follows the Robot Framework releases: one pull request for both
      robotframework:
        patterns:
          - "robotframework*"
