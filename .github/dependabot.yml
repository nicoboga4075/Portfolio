version: 2
updates:
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day, weekends included ("daily" only runs on weekdays)
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
      timezone: "Europe/Paris"
    groups:
      # The Capacitor packages (android, cli, core) release together and must stay on the same version
      capacitor:
        patterns:
          - "@capacitor/*"
  - package-ecosystem: "github-actions"
    # Keep the actions of .github/workflows up to date (checkout, setup-node, artifacts, scan actions), including the ones pinned to a commit SHA
    directory: "/"
    schedule:
      interval: "weekly"
