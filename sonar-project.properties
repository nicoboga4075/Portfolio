sonar.projectKey=nicoboga4075_Portfolio
sonar.organization=nicoboga4075
sonar.sources=.
sonar.sourceEncoding=UTF-8
# Tests are the files of tests/ (Playwright, Cypress, Robot Framework) and the Jest unit tests next to the code (js/*.test.js, netlify/**/*.test.js): they are not code to cover
sonar.tests=.
sonar.test.inclusions=tests/**,**/*.test.js
sonar.test.exclusions=node_modules/**,.netlify/**,reports/**
sonar.javascript.lcov.reportPaths=reports/jest/coverage/lcov.info
sonar.junit.reportPaths=reports/jest/junit.xml,reports/playwright/junit.xml
sonar.exclusions=node_modules/**,reports/**,images/**,videos/**,fonts/**,docs/public/**,**/.gitkeep,**/*.mp4,*.png,*.ico,**/*.min.js,**/*.min.css,tests/**,**/*.test.js
# The .claude and .github scripts, the build scripts at the root, the tool configs (*.config.js, *.config.mjs, *.config.cjs), the Eleventy directory data (*.11tydata.js) and the PowerShell CI scripts (*.ps1) are developer, CI and build tools that the site never ships and that have no tests, so they are left out of the coverage (still analysed for bugs and security).
sonar.coverage.exclusions=.claude/**,.github/**,**/*.config.js,**/*.config.mjs,**/*.config.cjs,**/*.11tydata.js,*.ps1,.eleventy.js,gen-redirects.js,uglify-code.js,update-version.js,dev-watch.js,html-validate-nunjucks.js
sonar.host.url=https://sonarcloud.io
sonar.qualitygate.wait=true

# The .claude scripts drive one browser page step by step, poll a local server and run worker-pool queues, so their awaits in loops are sequential on purpose (S9382); they run git and node from the developer's PATH (S4036).
sonar.issue.ignore.multicriteria=awaitLoop,pathCommand
sonar.issue.ignore.multicriteria.awaitLoop.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.awaitLoop.resourceKey=.claude/**/*.mjs
sonar.issue.ignore.multicriteria.pathCommand.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathCommand.resourceKey=.claude/**/*.mjs
